name: Build GPSFix APK

on:
  workflow_dispatch:
  push:
    branches:
      - gpsfix

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'

      - name: Prepare signing key
        run: |
          set -e
          mkdir -p keystore
          if [ -f keystore/smsf.jks ]; then
            echo "使用仓库内固定签名密钥（签名保持一致，可直接覆盖安装）"
          else
            echo "::warning::仓库内没有固定 keystore，本次临时生成；该包与其他构建签名不一致"
            keytool -genkeypair -v \
              -keystore keystore/smsf.jks \
              -storetype JKS \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias smsf \
              -storepass smsf123456 -keypass smsf123456 \
              -dname "CN=SmsForwarder GPSFix, OU=OmniBot, O=OmniBot, L=Beijing, ST=Beijing, C=CN"
          fi
          printf 'keyAlias=smsf\nkeyPassword=smsf123456\nstoreFile=%s/keystore/smsf.jks\nstorePassword=smsf123456\n' "$GITHUB_WORKSPACE" > keystore/keystore.properties
          cat keystore/keystore.properties
          keytool -list -v -keystore keystore/smsf.jks -storepass smsf123456 | grep -E 'SHA256:|Owner:' || true

      - name: Build release APK
        run: |
          set -e
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PbuildDate=260224 -PbuildTime="2026-02-24 10:00:00" \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            --max-workers=2

      - name: Collect APKs
        run: |
          mkdir -p out
          find . -path ./out -prune -o -name '*.apk' -print | while read -r f; do
            cp "$f" out/ 2>/dev/null || true
          done
          ls -lh out || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmsForwarder-gpsfix
          path: out/*.apk
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/build/reports/**
            **/*.log
          if-no-files-found: ignore


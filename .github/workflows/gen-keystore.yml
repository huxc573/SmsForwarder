name: Generate persistent signing key

# 一次性运行：生成固定签名密钥并作为 artifact 输出，
# 下载后提交到 keystore/smsf.jks，之后所有构建复用同一把钥匙，
# 版本之间可以直接覆盖安装（install -r），不会签名冲突。
on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'

      - name: Generate keystore
        run: |
          set -e
          mkdir -p out
          keytool -genkeypair -v \
            -keystore out/smsf.jks \
            -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias smsf \
            -storepass smsf123456 -keypass smsf123456 \
            -dname "CN=SmsForwarder GPSFix, OU=OmniBot, O=OmniBot, L=Beijing, ST=Beijing, C=CN"
          keytool -list -v -keystore out/smsf.jks -storepass smsf123456 | grep -E 'SHA256:|Owner:|Alias'
          base64 out/smsf.jks > out/smsf.jks.base64
          echo "--- base64 长度 ---"
          wc -c out/smsf.jks.base64

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: smsf-keystore
          path: |
            out/smsf.jks
            out/smsf.jks.base64
